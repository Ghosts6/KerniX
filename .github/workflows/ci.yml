# Build runs inside the toolchain image from the Dockerfile. Test steps get enabled stage by stage.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build toolchain image
        run: make docker-build

      - name: Build kernel
        run: make docker

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernix-elf
          path: build/kernix.elf

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build toolchain image
        run: make docker-build

      - name: Host unit tests
        run: docker run --rm -v "${{ github.workspace }}":/src -u "$(id -u):$(id -g)" kernix-build make test-host

      - name: QEMU boot test
        run: docker run --rm -v "${{ github.workspace }}":/src -u "$(id -u):$(id -g)" kernix-build make test-qemu
